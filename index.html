<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>高级乒乓球游戏 - Pong Deluxe</title>
  <style>
    :root {
      --primary: #00d9ff;
      --secondary: #ff006e;
      --accent: #8338ec;
      --dark: #0a0e27;
      --darker: #050812;
      --light: #f0f3ff;
      --success: #00ff88;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Arial', 'Microsoft YaHei', sans-serif;
      background: linear-gradient(135deg, var(--darker) 0%, #1a1f3a 50%, var(--dark) 100%);
      color: var(--light);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .container {
      width: 100%;
      max-width: 1400px;
      padding: 20px;
    }

    .header {
      text-align: center;
      margin-bottom: 30px;
      animation: glow 2s ease-in-out infinite;
    }

    @keyframes glow {
      0%, 100% { text-shadow: 0 0 10px var(--primary); }
      50% { text-shadow: 0 0 30px var(--primary), 0 0 50px var(--secondary); }
    }

    h1 {
      font-size: 3rem;
      background: linear-gradient(90deg, var(--primary), var(--secondary), var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 3px;
    }

    .subtitle {
      font-size: 0.9rem;
      color: var(--primary);
      letter-spacing: 2px;
    }

    .game-wrapper {
      display: grid;
      grid-template-columns: 1fr 300px;
      gap: 30px;
      margin-bottom: 30px;
    }

    .main-game {
      background: rgba(10, 14, 39, 0.8);
      border: 3px solid var(--primary);
      border-radius: 20px;
      padding: 25px;
      box-shadow: 0 0 40px rgba(0, 217, 255, 0.3), inset 0 0 30px rgba(0, 217, 255, 0.1);
      position: relative;
      overflow: hidden;
    }

    .game-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 15px;
      border-bottom: 2px solid var(--primary);
    }

    .game-mode {
      font-size: 0.9rem;
      color: var(--primary);
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .difficulty {
      font-size: 0.85rem;
      color: var(--accent);
      display: flex;
      gap: 8px;
    }

    .scoreboard {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      gap: 20px;
    }

    .score-box {
      flex: 1;
      text-align: center;
      background: rgba(0, 217, 255, 0.1);
      border: 2px solid var(--primary);
      border-radius: 15px;
      padding: 20px;
      position: relative;
      overflow: hidden;
    }

    .score-label {
      font-size: 0.75rem;
      color: var(--primary);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }

    .score-value {
      font-size: 2.5rem;
      font-weight: bold;
      color: var(--light);
      text-shadow: 0 0 10px var(--primary);
    }

    .vs {
      font-size: 1.2rem;
      color: var(--secondary);
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 2px;
      animation: pulse 1s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 16 / 9;
      background: radial-gradient(circle at center, #1a1f3a 0%, #0a0e27 100%);
      border: 2px solid var(--accent);
      border-radius: 10px;
      box-shadow: 0 0 30px rgba(131, 56, 236, 0.3);
    }

    .sidebar {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .panel {
      background: rgba(10, 14, 39, 0.8);
      border: 2px solid var(--primary);
      border-radius: 15px;
      padding: 20px;
      box-shadow: 0 0 20px rgba(0, 217, 255, 0.2);
    }

    .panel-title {
      font-size: 0.9rem;
      color: var(--primary);
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 15px;
      padding-bottom: 10px;
      border-bottom: 2px solid var(--primary);
    }

    .mode-btn, .difficulty-btn {
      width: 100%;
      padding: 10px;
      margin-bottom: 8px;
      background: rgba(0, 217, 255, 0.1);
      border: 2px solid var(--primary);
      color: var(--primary);
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.3s ease;
      text-transform: uppercase;
      font-size: 0.75rem;
      letter-spacing: 1px;
    }

    .mode-btn:hover, .difficulty-btn:hover {
      background: var(--primary);
      color: var(--darker);
      transform: translateX(5px);
      box-shadow: 0 0 20px var(--primary);
    }

    .mode-btn.active, .difficulty-btn.active {
      background: var(--primary);
      color: var(--darker);
      box-shadow: 0 0 20px var(--primary);
    }

    .difficulty-btn {
      border-color: var(--accent);
      color: var(--accent);
      background: rgba(131, 56, 236, 0.1);
      padding: 8px;
      font-size: 0.7rem;
    }

    .difficulty-btn:hover {
      background: var(--accent);
      color: var(--darker);
    }

    .stats-item {
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
      font-size: 0.8rem;
      padding: 8px;
      background: rgba(0, 217, 255, 0.05);
      border-radius: 5px;
    }

    .stats-label {
      color: var(--accent);
    }

    .stats-value {
      color: var(--success);
      font-weight: bold;
    }

    .controls {
      font-size: 0.75rem;
      color: var(--accent);
      line-height: 1.6;
      padding: 10px;
      background: rgba(131, 56, 236, 0.05);
      border-radius: 8px;
      border-left: 3px solid var(--accent);
    }

    .controls div {
      margin-bottom: 8px;
    }

    .key {
      background: rgba(0, 217, 255, 0.2);
      color: var(--primary);
      padding: 2px 6px;
      border-radius: 3px;
      font-weight: bold;
      display: inline-block;
      min-width: 30px;
      text-align: center;
    }

    .game-status {
      text-align: center;
      padding: 15px;
      background: rgba(131, 56, 236, 0.1);
      border: 2px solid var(--accent);
      border-radius: 10px;
      font-size: 0.9rem;
      color: var(--accent);
      margin-top: 20px;
    }

    .status-text {
      font-weight: bold;
      margin-bottom: 5px;
      font-size: 1.1rem;
      color: var(--primary);
    }

    .status-action {
      font-size: 0.85rem;
      color: var(--secondary);
    }

    .bottom-controls {
      display: flex;
      gap: 15px;
      justify-content: center;
      margin-top: 30px;
    }

    .btn {
      padding: 12px 30px;
      border: 2px solid var(--primary);
      background: rgba(0, 217, 255, 0.1);
      color: var(--primary);
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: all 0.3s ease;
      font-size: 0.9rem;
    }

    .btn:hover {
      background: var(--primary);
      color: var(--darker);
      transform: scale(1.05);
      box-shadow: 0 0 20px var(--primary);
    }

    @media (max-width: 1024px) {
      .game-wrapper {
        grid-template-columns: 1fr;
      }
      h1 {
        font-size: 2rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🎮 PONG DELUXE 🎮</h1>
      <p class="subtitle">— 高级乒乓球竞技游戏 —</p>
    </div>

    <div class="game-wrapper">
      <div class="main-game">
        <div class="game-header">
          <div class="game-mode">模式: <span id="modeDisplay">VS AI</span></div>
          <div class="difficulty" id="difficultyDisplay">★☆☆☆</div>
        </div>

        <div class="scoreboard">
          <div class="score-box">
            <div class="score-label">玩家1</div>
            <div class="score-value" id="playerScore">0</div>
          </div>
          <div class="vs">VS</div>
          <div class="score-box">
            <div class="score-label" id="opponentLabel">AI</div>
            <div class="score-value" id="opponentScore">0</div>
          </div>
        </div>

        <canvas id="gameCanvas" width="1200" height="675"></canvas>

        <div class="game-status">
          <div class="status-text" id="gameStatusText">准备就绪</div>
          <div class="status-action" id="gameStatusAction">按 SPACE 开始游戏</div>
        </div>
      </div>

      <div class="sidebar">
        <div class="panel">
          <div class="panel-title">游戏模式</div>
          <button class="mode-btn active" data-mode="vs-ai">VS AI</button>
          <button class="mode-btn" data-mode="vs-player">VS 玩家</button>
          <button class="mode-btn" data-mode="survival">生存模式</button>
          <button class="mode-btn" data-mode="time-attack">限时模式</button>
        </div>

        <div class="panel">
          <div class="panel-title">难度设置</div>
          <button class="difficulty-btn active" data-difficulty="easy">简单</button>
          <button class="difficulty-btn" data-difficulty="medium">中等</button>
          <button class="difficulty-btn" data-difficulty="hard">困难</button>
          <button class="difficulty-btn" data-difficulty="impossible">地狱</button>
        </div>

        <div class="panel">
          <div class="panel-title">统计信息</div>
          <div class="stats-item">
            <span class="stats-label">局数</span>
            <span class="stats-value" id="statsRounds">0</span>
          </div>
          <div class="stats-item">
            <span class="stats-label">击球数</span>
            <span class="stats-value" id="statsHits">0</span>
          </div>
          <div class="stats-item">
            <span class="stats-label">胜率</span>
            <span class="stats-value" id="statsWinRate">0%</span>
          </div>
          <div class="stats-item">
            <span class="stats-label">最高分</span>
            <span class="stats-value" id="statsHighScore">0</span>
          </div>
        </div>

        <div class="panel">
          <div class="panel-title">控制方式</div>
          <div class="controls" id="controlsDisplay">
            <div>
              <span class="key">↑↓</span> 或 <span class="key">鼠标</span><br/>玩家1球拍
            </div>
            <div>
              <span class="key">SPACE</span> 开始/暂停
            </div>
            <div>
              <span class="key">R</span> 重新开始
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="bottom-controls">
      <button class="btn" id="resetBtn">重新开始</button>
      <button class="btn" id="pauseBtn">暂停</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // UI 元素
    const playerScoreEl = document.getElementById('playerScore');
    const opponentScoreEl = document.getElementById('opponentScore');
    const opponentLabelEl = document.getElementById('opponentLabel');
    const modeDisplayEl = document.getElementById('modeDisplay');
    const difficultyDisplayEl = document.getElementById('difficultyDisplay');
    const statusTextEl = document.getElementById('gameStatusText');
    const statusActionEl = document.getElementById('gameStatusAction');
    const statsRoundsEl = document.getElementById('statsRounds');
    const statsHitsEl = document.getElementById('statsHits');
    const statsWinRateEl = document.getElementById('statsWinRate');
    const statsHighScoreEl = document.getElementById('statsHighScore');
    const controlsDisplayEl = document.getElementById('controlsDisplay');

    // 游戏对象
    const leftPaddle = {
      x: 36,
      y: canvas.height / 2 - 80,
      width: 22,
      height: 160,
      speed: 8,
    };

    const rightPaddle = {
      x: canvas.width - 58,
      y: canvas.height / 2 - 80,
      width: 22,
      height: 160,
      speed: 8,
    };

    const ball = {
      x: canvas.width / 2,
      y: canvas.height / 2,
      radius: 12,
      vx: 0,
      vy: 0,
      trail: [],
    };

    const keyboard = {
      ArrowUp: false,
      ArrowDown: false,
      KeyW: false,
      KeyS: false,
    };

    const difficulties = {
      easy: { label: '简单', ai: 5.3, ball: 6.5, angle: 0.7, target: 5 },
      medium: { label: '中等', ai: 6.8, ball: 7.4, angle: 0.9, target: 6 },
      hard: { label: '困难', ai: 8.1, ball: 8.6, angle: 1.1, target: 7 },
      impossible: { label: '地狱', ai: 10.2, ball: 10.1, angle: 1.35, target: 8 },
    };

    const modes = {
      'vs-ai': { label: 'VS AI', opponent: 'AI', target: 7 },
      'vs-player': { label: 'VS 玩家', opponent: '玩家2', target: 7 },
      survival: { label: '生存模式', opponent: '机器', target: 5 },
      'time-attack': { label: '限时模式', opponent: 'AI', target: 0 },
    };

    // 游戏状态
    let currentDifficulty = 'easy';
    let currentMode = 'vs-ai';
    let playerScore = 0;
    let opponentScore = 0;
    let rounds = 0;
    let totalHits = 0;
    let winCount = 0;
    let highScore = 0;
    let isPlaying = false;
    let isPaused = false;
    let isGameOver = false;
    let timeLeft = 60;
    let lastTimestamp = 0;
    let animationId = null;

    function clamp(value, min, max) {
      return Math.min(Math.max(value, min), max);
    }

    function getDifficultyConfig() {
      return difficulties[currentDifficulty];
    }

    function getModeConfig() {
      return modes[currentMode];
    }

    function setStatus(text, action) {
      statusTextEl.textContent = text;
      statusActionEl.textContent = action;
    }

    function updateControlsDisplay() {
      if (currentMode === 'vs-player') {
        controlsDisplayEl.innerHTML = `
          <div>
            <span class="key">↑↓</span> 或 <span class="key">鼠标</span><br/>玩家1球拍
          </div>
          <div>
            <span class="key">W</span> / <span class="key">S</span><br/>玩家2球拍
          </div>
          <div>
            <span class="key">SPACE</span> 开始/暂停
          </div>
          <div>
            <span class="key">R</span> 重新开始
          </div>
        `;
      } else {
        controlsDisplayEl.innerHTML = `
          <div>
            <span class="key">↑↓</span> 或 <span class="key">鼠标</span><br/>玩家1球拍
          </div>
          <div>
            <span class="key">SPACE</span> 开始/暂停
          </div>
          <div>
            <span class="key">R</span> 重新开始
          </div>
        `;
      }
    }

    function updateUI() {
      playerScoreEl.textContent = playerScore;
      opponentScoreEl.textContent = opponentScore;
      statsRoundsEl.textContent = rounds;
      statsHitsEl.textContent = totalHits;

      const totalGames = Math.max(1, rounds);
      const winRate = ((winCount / totalGames) * 100).toFixed(0);
      statsWinRateEl.textContent = `${winRate}%`;
      statsHighScoreEl.textContent = highScore;

      // 更新难度星级
      const starCount = {
        easy: 1,
        medium: 2,
        hard: 3,
        impossible: 4,
      };
      const stars = Array.from({ length: 4 }, (_, index) => {
        return index < starCount[currentDifficulty] ? '★' : '☆';
      }).join('');
      difficultyDisplayEl.innerHTML = stars;

      // 更新模式
      const modeCfg = getModeConfig();
      modeDisplayEl.textContent = modeCfg.label;
      opponentLabelEl.textContent = modeCfg.opponent;
    }

    function resetBall(direction = 1) {
      ball.x = canvas.width / 2;
      ball.y = canvas.height / 2;
      ball.trail = [];

      const cfg = getDifficultyConfig();
      const speed = cfg.ball;
      const angle = (Math.random() * 1.6 - 0.8) * cfg.angle;

      ball.vx = direction * speed * Math.cos(angle);
      ball.vy = speed * Math.sin(angle);
    }

    function resetPaddles() {
      leftPaddle.y = canvas.height / 2 - leftPaddle.height / 2;
      rightPaddle.y = canvas.height / 2 - rightPaddle.height / 2;
    }

    function restartMatch() {
      playerScore = 0;
      opponentScore = 0;
      totalHits = 0;
      rounds = 0;
      timeLeft = 60;
      winCount = 0;
      isPlaying = false;
      isPaused = false;
      isGameOver = false;
      resetPaddles();
      resetBall(1);
      setStatus('准备就绪', '按 SPACE 开始游戏');
      updateUI();
      updateControlsDisplay();
    }

    function checkGameOver() {
      const modeCfg = getModeConfig();
      const target = modeCfg.target || 7;

      if ((playerScore >= target || opponentScore >= target) && currentMode !== 'time-attack') {
        isGameOver = true;
        isPlaying = false;
        const winner = playerScore > opponentScore ? '玩家1胜' : '玩家2/AI胜';
        if (playerScore > opponentScore) winCount++;
        highScore = Math.max(highScore, Math.max(playerScore, opponentScore));
        setStatus(`${winner}，比赛结束`, '按 R 重新开始');
        return true;
      }

      if (currentMode === 'time-attack' && timeLeft <= 0) {
        isGameOver = true;
        isPlaying = false;
        const winner = playerScore > opponentScore ? '玩家胜' : opponentScore > playerScore ? 'AI 胜' : '平局';
        if (playerScore > opponentScore) winCount++;
        highScore = Math.max(highScore, Math.max(playerScore, opponentScore));
        setStatus(`${winner}，时间到`, '按 R 重新开始');
        return true;
      }

      return false;
    }

    function update(dt) {
      if (!isPlaying || isPaused) return;

      // 时间模式
      if (currentMode === 'time-attack') {
        timeLeft -= dt;
        if (timeLeft <= 0) {
          checkGameOver();
          return;
        }
      }

      // 左侧球拍（玩家1）
      if (keyboard.ArrowUp) {
        leftPaddle.y -= leftPaddle.speed;
      }
      if (keyboard.ArrowDown) {
        leftPaddle.y += leftPaddle.speed;
      }
      leftPaddle.y = clamp(leftPaddle.y, 0, canvas.height - leftPaddle.height);

      // 右侧球拍（玩家2或AI）
      if (currentMode === 'vs-player') {
        // 玩家2控制：W/S键
        if (keyboard.KeyW) {
          rightPaddle.y -= rightPaddle.speed;
        }
        if (keyboard.KeyS) {
          rightPaddle.y += rightPaddle.speed;
        }
      } else {
        // AI控制
        const targetY = ball.y - rightPaddle.height / 2;
        if (Math.abs(targetY - rightPaddle.y) > 5) {
          rightPaddle.y += (targetY - rightPaddle.y) * 0.08;
        }
      }
      rightPaddle.y = clamp(rightPaddle.y, 0, canvas.height - rightPaddle.height);

      // 球移动
      ball.x += ball.vx;
      ball.y += ball.vy;

      // 球的轨迹
      ball.trail.push({ x: ball.x, y: ball.y });
      if (ball.trail.length > 15) ball.trail.shift();

      // 上下墙碰撞
      if (ball.y - ball.radius <= 0) {
        ball.y = ball.radius;
        ball.vy *= -1;
      }
      if (ball.y + ball.radius >= canvas.height) {
        ball.y = canvas.height - ball.radius;
        ball.vy *= -1;
      }

      // 左侧球拍碰撞
      if (
        ball.x - ball.radius <= leftPaddle.x + leftPaddle.width &&
        ball.y >= leftPaddle.y &&
        ball.y <= leftPaddle.y + leftPaddle.height &&
        ball.vx < 0
      ) {
        ball.x = leftPaddle.x + leftPaddle.width + ball.radius;
        const relativeImpact = (ball.y - (leftPaddle.y + leftPaddle.height / 2)) / (leftPaddle.height / 2);
        ball.vx = Math.abs(ball.vx) + 0.5;
        ball.vy = relativeImpact * 8;
        totalHits++;
      }

      // 右侧球拍碰撞
      if (
        ball.x + ball.radius >= rightPaddle.x &&
        ball.y >= rightPaddle.y &&
        ball.y <= rightPaddle.y + rightPaddle.height &&
        ball.vx > 0
      ) {
        ball.x = rightPaddle.x - ball.radius;
        const relativeImpact = (ball.y - (rightPaddle.y + rightPaddle.height / 2)) / (rightPaddle.height / 2);
        ball.vx = -Math.abs(ball.vx) - 0.5;
        ball.vy = relativeImpact * 8;
        totalHits++;
      }

      // 计分
      if (ball.x < -ball.radius) {
        opponentScore++;
        if (!checkGameOver()) {
          resetBall(1);
        }
      }
      if (ball.x > canvas.width + ball.radius) {
        playerScore++;
        if (!checkGameOver()) {
          resetBall(-1);
        }
      }

      highScore = Math.max(highScore, Math.max(playerScore, opponentScore));
      updateUI();
    }

    function draw() {
      // 背景
      ctx.fillStyle = '#09152d';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // 渐变背景
      const gradient = ctx.createRadialGradient(
        canvas.width / 2, canvas.height / 2, 20,
        canvas.width / 2, canvas.height / 2, canvas.width * 0.7
      );
      gradient.addColorStop(0, '#122043');
      gradient.addColorStop(1, '#070d1d');
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // 中线
      ctx.strokeStyle = 'rgba(255,255,255,0.3)';
      ctx.lineWidth = 2;
      ctx.setLineDash([15, 18]);
      ctx.beginPath();
      ctx.moveTo(canvas.width / 2, 0);
      ctx.lineTo(canvas.width / 2, canvas.height);
      ctx.stroke();
      ctx.setLineDash([]);

      // 球拍 - 左侧
      ctx.fillStyle = '#00d9ff';
      ctx.shadowBlur = 20;
      ctx.shadowColor = '#00d9ff';
      ctx.fillRect(leftPaddle.x, leftPaddle.y, leftPaddle.width, leftPaddle.height);
      ctx.shadowBlur = 0;

      // 球拍 - 右侧
      ctx.fillStyle = '#ff5d8f';
      ctx.shadowBlur = 20;
      ctx.shadowColor = '#ff5d8f';
      ctx.fillRect(rightPaddle.x, rightPaddle.y, rightPaddle.width, rightPaddle.height);
      ctx.shadowBlur = 0;

      // 球的轨迹
      for (let i = 0; i < ball.trail.length; i++) {
        const p = ball.trail[i];
        ctx.fillStyle = `rgba(255,255,255,${i / ball.trail.length * 0.3})`;
        ctx.beginPath();
        ctx.arc(p.x, p.y, ball.radius * 0.6, 0, Math.PI * 2);
        ctx.fill();
      }

      // 球
      ctx.fillStyle = '#7ae7ff';
      ctx.shadowBlur = 25;
      ctx.shadowColor = '#00d9ff';
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;

      // 计时器（限时模式）
      if (currentMode === 'time-attack') {
        ctx.fillStyle = 'rgba(17, 24, 39, 0.8)';
        ctx.fillRect(canvas.width / 2 - 90, 20, 180, 40);
        ctx.strokeStyle = '#00d9ff';
        ctx.strokeRect(canvas.width / 2 - 90, 20, 180, 40);
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 20px Arial';
        ctx.textAlign = 'center';
        ctx.fillText(`TIME ${Math.max(0, Math.ceil(timeLeft))}s`, canvas.width / 2, 47);
      }
    }

    function animate(ts) {
      const dt = (ts - lastTimestamp) / 1000 || 0.016;
      lastTimestamp = ts;

      update(dt);
      draw();
      animationId = requestAnimationFrame(animate);
    }

    function togglePause() {
      if (isGameOver) return;

      if (!isPlaying) {
        isPlaying = true;
        isPaused = false;
        setStatus('游戏进行中', '按 SPACE 暂停');
        if (ball.vx === 0 && ball.vy === 0) {
          resetBall(Math.random() < 0.5 ? -1 : 1);
        }
        return;
      }

      isPaused = !isPaused;
      setStatus(
        isPaused ? '已暂停' : '游戏进行中',
        isPaused ? '按 SPACE 继续' : '按 SPACE 暂停'
      );
    }

    // 事件监听
    document.addEventListener('keydown', (e) => {
      if (e.code === 'Space') {
        e.preventDefault();
        togglePause();
      } else if (e.key === 'r' || e.key === 'R') {
        restartMatch();
      } else if (e.code === 'ArrowUp' || e.code === 'ArrowDown' || e.code === 'KeyW' || e.code === 'KeyS') {
        keyboard[e.code] = true;
      }
    });

    document.addEventListener('keyup', (e) => {
      if (keyboard.hasOwnProperty(e.code)) {
        keyboard[e.code] = false;
      }
    });

    canvas.addEventListener('mousemove', (e) => {
      const rect = canvas.getBoundingClientRect();
      const mouseY = e.clientY - rect.top;
      leftPaddle.y = mouseY - leftPaddle.height / 2;
      leftPaddle.y = clamp(leftPaddle.y, 0, canvas.height - leftPaddle.height);
    });

    // 模式和难度按钮
    document.querySelectorAll('.mode-btn').forEach((btn) => {
      btn.addEventListener('click', () => {
        currentMode = btn.dataset.mode;
        document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        restartMatch();
      });
    });

    document.querySelectorAll('.difficulty-btn').forEach((btn) => {
      btn.addEventListener('click', () => {
        currentDifficulty = btn.dataset.difficulty;
        document.querySelectorAll('.difficulty-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        updateUI();
      });
    });

    document.getElementById('resetBtn').addEventListener('click', restartMatch);
    document.getElementById('pauseBtn').addEventListener('click', togglePause);

    // 初始化并启动动画循环
    console.log('Game initialized');
    restartMatch();
    updateUI();
    updateControlsDisplay();
    animationId = requestAnimationFrame(animate);
  </script>
</body>
</html>
